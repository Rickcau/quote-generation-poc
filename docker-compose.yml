services:
  db:
    build: ./db
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=QuotePOC!2026
      - MSSQL_PID=Developer
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "QuotePOC!2026" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - sqldata:/var/opt/mssql

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=1433
      - DB_NAME=QuotePOC
      - DB_USER=sa
      - DB_PASSWORD=QuotePOC!2026
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:8000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqldata:
